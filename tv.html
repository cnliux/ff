<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // 主题预置：首帧前应用已保存的主题（localStorage 优先、cookie 兜底，与 VAUtils.getTheme 同规则），
        // 避免切页时先按默认 data-theme="dark" 渲染再跳变，保证各页主题一致
        (function() {
            var t = null;
            try { t = localStorage.getItem('site_theme'); } catch (e) {}
            if (!t || !/^(dark|warm|light)$/.test(t)) {
                try { var m = document.cookie.match(/(?:^|;\s*)site_theme=([^;]*)/); if (m) t = m[1]; } catch (e) {}
            }
            if (t && /^(dark|warm|light)$/.test(t)) document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <title>采集站管理</title>
    <link rel="stylesheet" href="css/style.css?v=20260915-9">
    <link rel="stylesheet" href="lib/fontawesome/css/all.min.css?v=20260915-9">
    <style>
        .admin-main { max-width: 1200px; margin: 0 auto; padding: 20px 16px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .admin-header h2 { font-size: 1.2rem; color: var(--text-primary); border-left: 4px solid var(--primary); padding-left: 10px; }
        .admin-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .admin-btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; transition: all .2s; display: inline-flex; align-items: center; gap: 6px; }
        .admin-btn-primary { background: var(--primary); color: #fff; }
        .admin-btn-primary:hover { opacity: .9; }
        .admin-btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-secondary); }
        .admin-btn-outline:hover { border-color: var(--primary); color: var(--primary); }
        .admin-btn-danger { background: #ef4444; color: #fff; }
        .admin-btn-danger:hover { background: #dc2626; }
        .admin-btn-success { background: #22c55e; color: #fff; }
        .admin-btn-success:hover { background: #16a34a; }

        .admin-stats { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
        .admin-stat-card { background: var(--bg-card); border-radius: 10px; padding: 16px 20px; flex: 1; min-width: 140px; box-shadow: var(--shadow-card); }
        .admin-stat-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
        .admin-stat-value { font-size: 1.5rem; font-weight: bold; color: var(--primary); }

        .admin-toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
        .admin-search { flex: 1; min-width: 200px; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-primary); font-size: 14px; outline: none; }

        .admin-table-wrap { background: var(--bg-card); border-radius: 12px; box-shadow: var(--shadow-card); overflow-x: auto; }
        .admin-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .admin-table thead { background: var(--bg-surface); }
        .admin-table th { padding: 12px 14px; text-align: left; font-weight: 600; color: var(--text-secondary); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; }
        .admin-table td { padding: 12px 14px; border-top: 1px solid var(--border); color: var(--text-primary); }
        .admin-table tr:hover { background: rgba(108,92,231,.04); }
        .admin-table .url-cell { max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: monospace; font-size: 12px; color: var(--text-secondary); }
        /* 名称列：长名称省略，避免撑开表格 */
        .admin-table td strong { display: inline-block; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }

        .status-toggle { position: relative; width: 40px; height: 22px; cursor: pointer; }
        .status-toggle input { display: none; }
        .status-slider { position: absolute; inset: 0; background: #555; border-radius: 11px; transition: .2s; }
        .status-slider:before { content: ''; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .2s; }
        .status-toggle input:checked + .status-slider { background: #22c55e; }
        .status-toggle input:checked + .status-slider:before { transform: translateX(18px); }

        .admin-icon-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 6px; border-radius: 6px; transition: .2s; font-size: 14px; }
        .admin-icon-btn:hover { background: rgba(108,92,231,.1); color: var(--primary); }
        .admin-icon-btn.danger:hover { background: rgba(239,68,68,.1); color: #ef4444; }

        .test-status { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; }
        .test-dot { width: 8px; height: 8px; border-radius: 50%; }
        .test-ok .test-dot { background: #22c55e; }
        .test-err .test-dot { background: #ef4444; }
        .test-unknown .test-dot { background: #888; }
        .test-testing .test-dot { background: #f59e0b; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }

        .admin-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 1000; align-items: center; justify-content: center; }
        .admin-modal-overlay.open { display: flex; }
        .admin-modal { background: var(--bg-card); border-radius: 14px; padding: 28px; width: 500px; max-width: 92vw; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
        .admin-modal h3 { font-size: 1.1rem; color: var(--text-primary); margin-bottom: 20px; }
        .admin-form-group { margin-bottom: 16px; }
        .admin-form-group label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; font-weight: 500; }
        .admin-form-group input, .admin-form-group select, .admin-form-group textarea {
            width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--bg-surface); color: var(--text-primary); font-size: 14px; outline: none;
        }
        .admin-form-group textarea { min-height: 120px; font-family: monospace; font-size: 13px; resize: vertical; }
        .admin-form-group input:focus, .admin-form-group select:focus, .admin-form-group textarea:focus { border-color: var(--primary); }
        .admin-form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        .empty-state i { font-size: 48px; margin-bottom: 16px; opacity: .3; }

        .drop-zone { border: 2px dashed var(--border); border-radius: 12px; padding: 40px; text-align: center; color: var(--text-secondary); cursor: pointer; transition: .2s; margin-bottom: 16px; }
        .drop-zone:hover, .drop-zone.dragover { border-color: var(--primary); background: rgba(108,92,231,.05); }
        .drop-zone i { font-size: 32px; margin-bottom: 12px; opacity: .5; }

        .block-list { display: flex; flex-wrap: wrap; gap: 8px; min-height: 40px; padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-surface); }
        .block-chip { display: inline-flex; align-items: center; gap: 6px; background: rgba(239,68,68,.12); color: #ef4444; border: 1px solid rgba(239,68,68,.3); border-radius: 16px; padding: 4px 10px; font-size: 12px; }
        .block-chip .del { cursor: pointer; font-weight: bold; }
        .block-chip .del:hover { color: #dc2626; }
        .block-empty { color: var(--text-secondary); font-size: 13px; align-self: center; }

        .cat-tags { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-surface); }
        .cat-tag-btn { padding: 6px 14px; border-radius: 16px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-primary); cursor: pointer; font-size: 13px; transition: .2s; }
        .cat-tag-btn:hover { border-color: var(--primary); color: var(--primary); }
        .cat-tag-btn.blocked { background: rgba(239,68,68,.15); color: #ef4444; border-color: rgba(239,68,68,.4); }
        .cat-loading { color: var(--text-secondary); font-size: 13px; }

        @media (max-width: 640px) {
            .admin-main { padding: 16px 10px; }
            .admin-header { gap: 8px; }
            .admin-header h2 { font-size: 1.05rem; padding-left: 8px; }
            .admin-actions { gap: 6px; width: 100%; }
            .admin-btn { padding: 6px 10px; font-size: 12px; gap: 4px; flex: 1 1 auto; justify-content: center; min-width: 0; }
            .admin-btn i { font-size: 12px; }
            .admin-toolbar { gap: 6px; }
            .admin-search { min-width: 100%; padding: 8px 12px; font-size: 13px; }
            .admin-modal { padding: 18px; width: 94vw; }

                        /* 表格：固定布局，操作列留够空间放 5 个按钮 */
            .admin-table { font-size: 12px; table-layout: fixed; width: 100%; }
            .admin-table th, .admin-table td { padding: 6px 3px; vertical-align: middle; }
            .admin-table th { font-size: 10px; letter-spacing: 0; }

            /* 列宽分配 */
            .admin-table th:nth-child(1), .admin-table td:nth-child(1) { width: 24px; text-align: center; }
            .admin-table th:nth-child(2), .admin-table td:nth-child(2) { width: 18%; }
            .admin-table th:nth-child(3), .admin-table td:nth-child(3) { width: 26%; }
            .admin-table th:nth-child(4), .admin-table td:nth-child(4) { display: none; }
            .admin-table th:nth-child(5), .admin-table td:nth-child(5) { width: 40px; }
            .admin-table th:nth-child(6), .admin-table td:nth-child(6) { width: 50px; }
            .admin-table th:nth-child(7), .admin-table td:nth-child(7) { width: 110px; }

            /* 操作列：一排 5 个按钮不换行、不裁切 */
            .admin-table td:last-child {
                display: flex;
                gap: 1px;
                justify-content: flex-start;
                align-items: center;
                white-space: nowrap;
            }
            .admin-table .admin-icon-btn {
                padding: 3px 4px;
                font-size: 12px;
                flex-shrink: 0;
                min-width: 20px;
            }

            /* 地址列缩紧 */
            .admin-table .url-cell {
                max-width: none;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                font-size: 10px;
                line-height: 1.4;
            }

            /* 名称列缩紧 */
            .admin-table td:nth-child(2) strong {
                display: inline-block;
                max-width: 100%;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                vertical-align: middle;
            }

            /* 状态开关缩小 */
            .status-toggle { width: 32px; height: 18px; }
            .status-toggle input:checked + .status-slider:before { transform: translateX(14px); }
            .status-slider:before { width: 14px; height: 14px; top: 2px; left: 2px; }

            /* 测速文字缩小 */
            .admin-table .test-status { font-size: 10px; }
        }
    </style>
</head>

        <button class="admin-btn admin-btn-danger" id="btnClearAll"><i class="fas fa-trash"></i> 清空</button>

    <div class="admin-table-wrap">

<script>
(function() {
    'use strict';

    VAUtils.setTheme(VAUtils.getTheme());
    VAUtils.initThemeSwitch();

    // 只允许 http/https 的 URL
    function isHttpUrl(url) {
        if (!url || typeof url !== 'string') return false;
        try {
            var p = new URL(url, window.location.href);
            return p.protocol === 'http:' || p.protocol === 'https:';
        } catch (e) { return false; }
    }

    // ========== 个人本地源 ==========
    var sources = [];
    var STORAGE_KEY = 'va_sources';

    function loadSources() {
        try {
            var saved = localStorage.getItem(STORAGE_KEY);
            sources = saved ? JSON.parse(saved) : [];
            if (!Array.isArray(sources)) sources = [];
        } catch(e) { sources = []; }
        // 清理 api_url 的 query；初始化运行时字段（避免读到旧测试状态）
        sources.forEach(function(s) {
            if (s && s.api_url && s.api_url.indexOf('?') !== -1) {
                s.api_url = s.api_url.split('?')[0];
            }
            s._testStatus = '';
            s._testText = '';
        });
    }

    function saveSources() {
        try {
            // 源列表变更 → 首页按 sid 缓存的分类（sessionStorage）作废，下次进入重新拉取
            sessionStorage.removeItem(VAUtils.CAT_CACHE_KEY);
        } catch(e) {}
        try {
            // 源列表变更 → 首页的会话级源列表缓存一并作废，避免采用旧缓存里被删的源
            sessionStorage.removeItem('va_sources_cache');
        } catch(e) {}
        try {
            // 剥离运行时字段 _testStatus / _testText，不写入 localStorage
            var clean = sources.map(function(s) {
                return {
                    id: s.id,
                    name: s.name,
                    api_url: s.api_url,
                    status: s.status,
                    priority: s.priority || 1
                };
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(clean));
            // 写入当前数据版本号：api.js 的 loadSources 依赖该版本号决定是否采用本地个人源
            if (window.VA && VA.DATA_VER) {
                localStorage.setItem('va_sources_ver', VA.DATA_VER);
            }
        } catch(e) {
            // localStorage 空间不足（QuotaExceededError）时 setItem 静默失败，
            // 若不提示，用户以为已保存，重开页面后改动全部丢失
            var isQuota = e && (e.name === 'QuotaExceededError' ||
                e.name === 'NS_ERROR_DOM_QUOTA_REACHED' || e.code === 22);
            if (isQuota) {
                alert('保存失败：本地存储空间不足，改动将不会被保存。请删除部分来源后重试。');
            } else {
                alert('保存失败：无法写入本地存储（' + ((e && e.message) ? e.message : e) + '），改动将不会被保存。');
            }
        }
        updateStats();
        renderSources();
    }

    function getNextId() {
        var max = 0;
        sources.forEach(function(s) { if (s.id > max) max = s.id; });
        return max + 1;
    }

    function updateStats() {
        var el;
        el = document.getElementById('statTotal');
        if (el) el.textContent = sources.length;
        el = document.getElementById('statOk');
        if (el) el.textContent = sources.filter(function(s) { return s.status === 1; }).length;
        el = document.getElementById('statErr');
        if (el) el.textContent = sources.filter(function(s) { return s.status === 0; }).length;
    }

    // ↓↓↓ 新增：名称列最多显示 max 个字符，超出用省略号（完整名称放 title，悬停可见）
    function shortName(name, max) {
        var str = String(name == null ? '' : name);
        return str.length > max ? str.slice(0, max) + '…' : str;
    }
    // ↑↑↑ 新增结束

    function renderSources() {
        var search = document.getElementById('searchInput').value.trim().toLowerCase();
        var filtered = sources.filter(function(s) {
            // 导入的 JSON 里 name/api_url 可能不是字符串，统一 String() 再比较，防止整表渲染中断
            var nm = String(s.name || '').toLowerCase();
            var ap = String(s.api_url || '').toLowerCase();

        var html = '';
        filtered.forEach(function(s) {
            var realIndex = sources.indexOf(s);

            // 全部按钮改用 data-act 属性 + 事件委托，去掉内联 onclick（CSP 兼容）
            html += '<tr data-idx="' + realIndex + '">' +
                '<td>' + VAUtils.escHtml(s.id) + '</td>' +
                '<td><strong title="' + VAUtils.escHtml(s.name) + '">' + VAUtils.escHtml(shortName(s.name, 2)) + '</strong></td>' +
                '<td class="url-cell" title="' + VAUtils.escHtml(s.api_url) + '">' + VAUtils.escHtml(s.api_url) + '</td>' +
                '<td>' + parseInt(s.priority || 1, 10) + '</td>' +
                '<td>' +
                    '<label class="status-toggle">' +
                        '<input type="checkbox" data-act="toggle-status" ' + (s.status === 1 ? 'checked' : '') + '>' +
                        '<span class="status-slider"></span>' +
                    '</label>' +
                '</td>' +
                '<td class="test-status-cell"><span class="test-status ' + VAUtils.escHtml(s._testStatus || '') + '"><span class="test-dot"></span>' + VAUtils.escHtml(stText) + '</span></td>' +
                '<td>' +
'<button class="admin-icon-btn" data-act="cats" title="获取分类" aria-label="获取分类"><i class="fas fa-list"></i></button>' +
'<button class="admin-icon-btn" data-act="test" title="测速" aria-label="测速"><i class="fas fa-heartbeat"></i></button>' +
'<button class="admin-icon-btn" data-act="edit" title="编辑" aria-label="编辑"><i class="fas fa-edit"></i></button>' +
'<button class="admin-icon-btn" data-act="dup" title="复制" aria-label="复制"><i class="fas fa-copy"></i></button>' +
'<button class="admin-icon-btn danger" data-act="del" title="删除" aria-label="删除"><i class="fas fa-trash"></i></button>' +
                '</td></tr>';
        });

    // 事件委托：表格按钮
    document.getElementById('sourceList').addEventListener('click', function(e) {
        var btn = e.target.closest('.admin-icon-btn');
        if (!btn) return;
        e.preventDefault();
        var tr = btn.closest('tr');
        if (!tr) return;
        var idx = parseInt(tr.getAttribute('data-idx'));
        var act = btn.getAttribute('data-act');
        if (isNaN(idx) || idx < 0 || idx >= sources.length) return;
        if (act === 'cats') window.loadCats(idx);
        else if (act === 'test') window.testSource(idx);
        else if (act === 'edit') window.editSource(idx);

    // 事件委托：状态开关
    document.getElementById('sourceList').addEventListener('change', function(e) {
        var input = e.target;

    // ========== 测速核心（返回 Promise）==========
    // WebView 版：直接走 VAHttp（OkHttp 直连采集站），不经 CORS 代理/票据，无需 buildProxyRequest。
    function probeSource(s, timeoutMs) {
        timeoutMs = timeoutMs || 15000;
        return new Promise(function(resolve) {
            try {
                var baseUrl = (s.api_url || '').split('?')[0];
                if (!baseUrl || baseUrl.indexOf('http') !== 0) {
                    s._testStatus = 'test-err'; s._testText = '地址无效';
                    resolve(false); return;
                }
                s._testStatus = 'test-testing'; s._testText = '检测中';
                var testUrl = baseUrl + '?ac=list&ids=1';
                var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
                var timer = setTimeout(function() { if (ctrl) ctrl.abort(); }, timeoutMs);
                var done = false;
                function finish(ok, text) {
                    if (done) return;
                    done = true;
                    clearTimeout(timer);
                    s._testStatus = ok ? 'test-ok' : 'test-err';
                    s._testText = ok ? '可用' : text || '网络错误';
                    resolve(ok);
                }
                window.VAHttp.getText(testUrl, { signal: ctrl ? ctrl.signal : null })
                    .then(function() { finish(true); })
                    .catch(function(err) {
                        var isAbort = ctrl && err && err.name === 'AbortError';
                        finish(false, isAbort ? '超时' : '网络错误');
                    });
            } catch (e) {
                if (s) { s._testStatus = 'test-err'; s._testText = '检测异常'; }
                resolve(false);
            }
        });
    }

    // 只更新某一行测速状态单元格，避免测速期间 N 次全量重建表格（源多时会闪屏）
    function updateTestRow(index) {
        var s = sources[index];
        if (!s) return;
        var row = document.querySelector('#sourceList tr[data-idx="' + index + '"]');
        if (!row) return;
        var cell = row.querySelector('.test-status-cell');
        if (!cell) return;
        cell.innerHTML = '<span class="test-status ' + VAUtils.escHtml(s._testStatus || '') + '"><span class="test-dot"></span>' + VAUtils.escHtml(String(s._testText || '未测')) + '</span>';
    }

    // 单站测速（点击「测速」按钮）
    window.testSource = function(index) {
        var s = sources[index];
        if (!s) return;
        probeSource(s).then(function() {
            updateTestRow(index);
            updateStats();
        });
    };

    // Edit
    window.editSource = function(index) {
        var s = sources[index];
        if (!s) return; // 防御：index 越界直接忽略，避免 s.name 抛错
        document.getElementById('editModalTitle').textContent = '编辑采集站';
        document.getElementById('editIndex').value = index;
        document.getElementById('editName').value = s.name;
        document.getElementById('editApiUrl').value = s.api_url;

        document.getElementById('editModal').classList.add('open');
    };

    // Duplicate
    window.duplicateSource = function(index) {
        var s = sources[index];
        var copy = JSON.parse(JSON.stringify(s));
        copy.id = getNextId();
        copy.name = s.name + ' (副本)';
        copy.status = 1; // 副本默认启用，不继承原源的禁用状态
        // 清空运行时测试状态，避免副本显示旧结果
        copy._testStatus = '';
        copy._testText = '';
        sources.push(copy);
        saveSources();
        VAUtils.showToast('已复制: ' + s.name, 2000);
    };

    // Delete
    window.deleteSource = function(index) {
        if (!confirm('确定删除 "' + sources[index].name + '"？')) return;
        sources.splice(index, 1);
        saveSources();
    };

    // Add
    document.getElementById('btnAdd').addEventListener('click', function() {
        document.getElementById('editModalTitle').textContent = '添加采集站';
        document.getElementById('editIndex').value = '';
        document.getElementById('editName').value = '';
        document.getElementById('editApiUrl').value = '';
        document.getElementById('editPriority').value = '1';
        document.getElementById('editStatus').value = '1';
        document.getElementById('editModal').classList.add('open');
    });

    // Save edit
    document.getElementById('btnSaveEdit').addEventListener('click', function() {
        var name = document.getElementById('editName').value.trim();
        var apiUrl = document.getElementById('editApiUrl').value.trim();
        if (!name || !apiUrl) { alert('名称和API地址不能为空'); return; }
        if (!isHttpUrl(apiUrl)) { alert('API地址必须以 http:// 或 https:// 开头'); return; }
        var index = document.getElementById('editIndex').value;
        var s = {
            name: name,
            api_url: apiUrl,

        };

        } else {

    // Test all：异步队列，并发 4，避免 setTimeout 累积
    document.getElementById('btnTestAll').addEventListener('click', function() {
        var btn = this;
        if (btn.disabled) return;
        if (!sources.length) { VAUtils.showToast('没有可测试的采集站', 2000); return; }
        btn.disabled = true;
        // 与「删除无效源」互斥：两者都会并发操作 sources，同时跑会错位
        var delBtn = document.getElementById('btnDeleteInvalid');
        if (delBtn) delBtn.disabled = true;
        var originHtml = btn.innerHTML;
        var total = sources.length, checked = 0;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 测速 0/' + total;

        var CONC = 4;
        var queue = sources.slice();
        function next() {
            var s = queue.shift();
            if (!s) return;
            probeSource(s).then(function() {
                checked++;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 测速 ' + checked + '/' + total;
                updateTestRow(sources.indexOf(s));   // 只刷新该行，避免测速期间 N 次全表重绘闪屏
                updateStats();
                if (checked >= total) {
                    btn.disabled = false;
                    if (delBtn) delBtn.disabled = false;
                    btn.innerHTML = originHtml;
                    renderSources();   // 结束时统一重建一次，保证表格与内部状态完全一致
                    VAUtils.showToast('全部测速完成', 2500);
                } else {
                    next();
                }
            });
        }
        for (var i = 0; i < CONC && queue.length; i++) next();
    });

    // Block all invalid sources
    document.getElementById('btnBlockInvalid').addEventListener('click', function() {
        var invalid = sources.filter(function(s) { return s._testStatus === 'test-err'; });
        if (!invalid.length) { alert('没有检测到无效的采集站，请先点击"全部测速"'); return; }
        if (!confirm('确定屏蔽 ' + invalid.length + ' 个无效采集站？')) return;
        invalid.forEach(function(s) { s.status = 0; });
        saveSources();
        VAUtils.showToast('已屏蔽 ' + invalid.length + ' 个无效采集站', 3000);
    });

    // 删除重复源
    document.getElementById('btnDedupe').addEventListener('click', function() {
        var groups = {};
        var order = [];
        var dupCount = 0;
        sources.forEach(function(s) {
            var key = (s.api_url || '').split('?')[0].trim().toLowerCase();
            if (!key) { order.push(s); return; }
            var cur = groups[key];
            if (!cur) {
                groups[key] = s;
                order.push(s);
            } else {
                dupCount++;
                var curBetter = (cur.status === 1 ? 0 : 1) * 100 + (cur.priority || 1);
                var newBetter = (s.status === 1 ? 0 : 1) * 100 + (s.priority || 1);
                if (newBetter < curBetter) {
                    order[order.indexOf(cur)] = s;
                    groups[key] = s;
                }
            }
        });
        if (!dupCount) { VAUtils.showToast('没有重复的采集站', 2000); return; }
        if (!confirm('发现 ' + dupCount + ' 个重复采集站（相同 API 地址），确定删除重复项？')) return;
        sources = order;
        saveSources();
        VAUtils.showToast('已删除 ' + dupCount + ' 个重复采集站', 2500);
    });

    // 删除无效源：并发批量检测（修复：testUrl 未定义 + 卡死问题）
    document.getElementById('btnDeleteInvalid').addEventListener('click', function() {
        var btn = this;
        if (btn.disabled) return;
        if (!sources.length) { VAUtils.showToast('没有可检测的采集站', 2000); return; }
        btn.disabled = true;
        // 与「全部测速」互斥，避免两个队列同时操作 sources 导致索引错位
        var testBtn = document.getElementById('btnTestAll');
        if (testBtn) testBtn.disabled = true;
        var originHtml = btn.innerHTML;
        var total = sources.length, checked = 0, valid = 0, invalid = [];
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 检测中 0/' + total;

        var CONC = 4, queue = sources.slice();
        function next() {
            var s = queue.shift();
            if (!s) return;
            probeSource(s, 10000).then(function(ok) {
                checked++;
                if (ok) valid++; else invalid.push(s);
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 检测中 ' + checked + '/' + total;
                updateStats();
                updateTestRow(sources.indexOf(s)); // 只刷新该行状态单元格，不全量重建表格
                if (checked >= total) {
                    finish();
                } else {
                    next();
                }
            });
        }
        for (var i = 0; i < CONC && queue.length; i++) next();

        function finish() {
            btn.disabled = false;
            btn.innerHTML = originHtml;
            if (testBtn) testBtn.disabled = false;
            updateStats();
            renderSources();
            if (!invalid.length) { VAUtils.showToast('全部 ' + total + ' 个采集站均有效', 2500); return; }
            // 无效源过多时 confirm 弹窗会撑爆屏幕：只列前 5 个 + 剩余数量
            var names = invalid.map(function(s) { return '· ' + s.name + '（' + s._testText + '）'; });
            if (names.length > 5) names = names.slice(0, 5).concat(['…及另外 ' + invalid.length + ' 个（共 ' + names.length + ' 个无效）']);
            if (!confirm('检测完成：' + valid + ' 个有效，' + invalid.length + ' 个无效：\n\n' + names.join('\n') + '\n\n确定删除这些无效采集站？')) return;
            sources = sources.filter(function(s) { return invalid.indexOf(s) === -1; });
            saveSources();
            VAUtils.showToast('已删除 ' + invalid.length + ' 个无效采集站', 2500);
        }
    });

    // Sort by priority
    document.getElementById('btnSortPriority').addEventListener('click', function() {
        sources.sort(function(a, b) { return (a.priority || 1) - (b.priority || 1); });
        saveSources();
        VAUtils.showToast('已按优先级排序', 2000);
    });

    // Clear all
    document.getElementById('btnClearAll').addEventListener('click', function() {
        if (!sources.length) return;
        if (!confirm('确定清空所有采集站？')) return;
        sources = [];
        saveSources();
    });

    // Search
    document.getElementById('searchInput').addEventListener('input', renderSources);

    // ========== Export ==========
    // WebView 内 <a download>+blob: 会静默失败（无 DownloadListener，DownloadManager 也
    // 取不到 blob: URL），因此优先走原生 saveFile 写入下载目录；桌面浏览器调试降级为
    // blob 下载。okMsg 为成功提示；失败时原生路径 alert、桌面路径沿用 toast。
    function downloadFile(content, filename, type, okMsg) {
        var msg = okMsg || ('已导出 ' + filename);
        if (window.VASave && window.AndroidBridge && typeof window.AndroidBridge.saveFile === 'function') {
            window.VASave.save(filename, content)
                .then(function(loc) { VAUtils.showToast(msg + '（' + loc + '）', 3000); })
                .catch(function(e) { alert('导出失败: ' + ((e && e.message) || '未知错误')); });
            return;
        }
        var blob = new Blob([content], { type: type + ';charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = filename; a.click();
        // 立即 revoke 在部分浏览器会中断尚未开始的下载，延迟回收
        setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
        VAUtils.showToast(msg, 3000);
    }

    document.getElementById('btnSaveJson').addEventListener('click', function() {
        if (!sources.length) { alert('没有可保存的数据'); return; }
        var data = sources.map(function(s) {
            return { id: s.id, name: s.name, api_url: s.api_url, status: s.status, priority: s.priority || 1 };

    document.getElementById('btnExportTvbox').addEventListener('click', function() {

        var tvbox = {
            sites: sources.map(function(s) {
                return {
                    key: 'vid_' + s.id,

                    type: 1,

    // ========== Import TVBox ==========
    document.getElementById('btnImportTvbox').addEventListener('click', function() {
        document.getElementById('tvboxInput').value = '';
        document.getElementById('tvboxUrl').value = '';
        document.getElementById('tvboxModal').classList.add('open');
    });

    document.getElementById('btnDoTvboxImport').addEventListener('click', function() {
        var input = document.getElementById('tvboxInput').value.trim();
        var url = document.getElementById('tvboxUrl').value.trim();

        function doImport(text) {
            try {
                var data = JSON.parse(text);
                var sites = data.sites || data.storeHouse || [];
                // 防御：订阅 JSON 里 sites 不是数组（如对象/字符串）时 forEach 会抛错，导入会中断
                if (!Array.isArray(sites)) sites = [];
                var count = 0, skipped = 0, skippedType = 0;
                sites.forEach(function(site) {
                    // TVBox type 不为 1 的是爬虫仓/软件仓等非 JSON 协议站，本站无法拉取，直接跳过
                    if (site.type !== undefined && String(site.type) !== '1') { skippedType++; return; }
                    if (!site.api && !site.url) return;
                    var apiUrl = site.api || site.url || '';
                    if (!apiUrl) return;
                    if (!isHttpUrl(apiUrl)) { skipped++; return; }
                    // 入库时会去掉 query，去重也必须拿去掉 query 后的地址比对，
                    // 否则同一个站带 ?xx 再导入一次会被当成新站重复添加。
                    var cleanUrl = apiUrl.split('?')[0];
                    var exists = sources.some(function(s) { return s.api_url === cleanUrl; });
                    if (exists) return;
                    sources.push({
                        id: getNextId(),
                        name: site.name || site.key || '未命名',
                        api_url: cleanUrl,
                        status: 1,
                        priority: 1,
                        _testStatus: '',
                        _testText: ''
                    });
                    count++;
                });
                saveSources();
                closeModal('tvboxModal');
                var msg = '导入成功，新增 ' + count + ' 个采集站';
                if (skipped) msg += '（' + skipped + ' 个地址不合法已跳过）';
                if (skippedType) msg += '（' + skippedType + ' 个非 JSON 协议已跳过）';
                VAUtils.showToast(msg, 3000);
            } catch(e) {
                alert('JSON解析失败: ' + e.message);
            }
        }

        if (input) {
            doImport(input);
        } else if (url) {
            if (!isHttpUrl(url)) { alert('订阅链接必须以 http:// 或 https:// 开头'); return; }
            VAUtils.showToast('正在获取订阅...', 3000);
            var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
            var timer = setTimeout(function() { if (ctrl) ctrl.abort(); }, 15000);
            window.VAHttp.getText(url, { signal: ctrl ? ctrl.signal : null })
                .then(function(text) {
                    clearTimeout(timer);
                    doImport(text);
                })
                .catch(function(e) {
                    clearTimeout(timer);
                    alert('获取订阅失败: ' + (e && e.name === 'AbortError' ? '已超时' : (e && e.message) || '网络错误'));
                });
        } else {
            alert('请输入JSON内容或订阅链接');
        }
    });

    // ========== Import JSON ==========
    document.getElementById('btnImportJson').addEventListener('click', function() {
        document.getElementById('jsonInput').value = '';
        document.getElementById('jsonUrl').value = '';
        document.getElementById('jsonModal').classList.add('open');
    });

    document.getElementById('btnDoJsonImport').addEventListener('click', function() {
        var input = document.getElementById('jsonInput').value.trim();
        var url = document.getElementById('jsonUrl').value.trim();

        function doImport(text) {
            try {
                var data = JSON.parse(text);
                if (!Array.isArray(data)) data = data.sites || data.data || [];
                // 防御：JSON 里不是数组则跳过导入，而不是 forEach 抛错
                if (!Array.isArray(data)) data = [];
                var count = 0, skipped = 0;
                data.forEach(function(item) {
                    var apiUrl = item.api_url || item.api || item.url || '';
                    if (!apiUrl) return;
                    if (!isHttpUrl(apiUrl)) { skipped++; return; }
                    // 同 TVBox 导入：按去掉 query 后的地址去重，避免重复站入库
                    var cleanUrl = apiUrl.split('?')[0];
                    var exists = sources.some(function(s) { return s.api_url === cleanUrl; });
                    if (exists) return;
                    sources.push({
                        id: getNextId(),
                        name: item.name || '未命名',
                        api_url: cleanUrl,
                        status: item.status !== undefined ? item.status : 1,
                        priority: item.priority || 1,
                        _testStatus: '',
                        _testText: ''
                    });
                    count++;
                });
                saveSources();
                closeModal('jsonModal');
                var msg = '导入成功，新增 ' + count + ' 个采集站';
                if (skipped) msg += '（' + skipped + ' 个地址不合法已跳过）';
                VAUtils.showToast(msg, 3000);
            } catch(e) {
                alert('JSON解析失败: ' + e.message);
            }
        }

        if (input) {
            doImport(input);
        } else if (url) {
            if (!isHttpUrl(url)) { alert('JSON地址必须以 http:// 或 https:// 开头'); return; }
            VAUtils.showToast('正在获取JSON...', 3000);
            var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
            var timer = setTimeout(function() { if (ctrl) ctrl.abort(); }, 15000);
            window.VAHttp.getText(url, { signal: ctrl ? ctrl.signal : null })
                .then(function(text) {
                    clearTimeout(timer);
                    doImport(text);
                })
                .catch(function(e) {
                    clearTimeout(timer);
                    alert('获取JSON失败: ' + (e && e.name === 'AbortError' ? '已超时' : (e && e.message) || '网络错误'));
                });
        } else {
            alert('请输入JSON内容或JSON文件地址');
        }
    });

    // File upload
    var dropZone = document.getElementById('dropZone');
    var fileInput = document.getElementById('fileInput');

    dropZone.addEventListener('click', function() { fileInput.click(); });
    dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('dragover'); });
    dropZone.addEventListener('drop', function(e) {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        var file = e.dataTransfer.files[0];
        if (file) readFile(file);
    });
    fileInput.addEventListener('change', function() {
        if (fileInput.files[0]) readFile(fileInput.files[0]);
    });

    function readFile(file) {
        var reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('jsonInput').value = e.target.result;
        };
        reader.readAsText(file);
    }

    // Modal close
    window.closeModal = function(id) {
        document.getElementById(id).classList.remove('open');
    };

    document.querySelectorAll('.admin-modal-overlay').forEach(function(overlay) {
        overlay.addEventListener('click', function(e) {
            if (e.target === overlay) overlay.classList.remove('open');
        });
    });

    // data-close-modal：统一关闭按钮（取代内联 onclick="closeModal(...)"）
    document.querySelectorAll('[data-close-modal]').forEach(function(btn) {
        btn.addEventListener('click', function() {
            window.closeModal(btn.getAttribute('data-close-modal'));
        });
    });

    // ========== 屏蔽管理 ==========
    function renderBlockChips(listEl, items, emptyText, kind) {
        listEl.innerHTML = '';
        if (!items.length) {
            listEl.innerHTML = '<span class="block-empty">' + emptyText + '</span>';
            return;
        }
        items.forEach(function(c) {
            var chip = document.createElement('span');
            chip.className = 'block-chip';
            chip.innerHTML = VAUtils.escHtml(c) + ' <span class="del" title="移除">×</span>';
            chip.querySelector('.del').addEventListener('click', function() {
                if (!confirm('移除屏蔽' + kind + ' "' + c + '"？')) return;
                if (kind === '分类') VA.removeBlockedCategory(c);
                else VA.removeBlockedKeyword(c);
                renderBlockList();
            });
            listEl.appendChild(chip);
        });
    }

    function renderBlockList() {
        renderBlockChips(document.getElementById('blockCatList'), VA.getBlockedCategories(), '暂无屏蔽分类', '分类');
        renderBlockChips(document.getElementById('blockKwList'), VA.getBlockedKeywords(), '暂无屏蔽关键词', '关键词');
    }

    function downloadBlockConfig() {
        var cfg = VA.getBlockConfig();
        cfg.name = '屏蔽配置导出';
        cfg.description = '由视频聚合屏蔽管理导出，可再次导入恢复';
        cfg.exported_at = new Date().toISOString();
        downloadFile(JSON.stringify(cfg, null, 2), 'block-config.json', 'application/json', '已导出屏蔽配置');
    }

    function importBlockConfigFromFile(file) {
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function() {
            try {
                var cfg = JSON.parse(reader.result);
                if (!cfg) { throw new Error('格式不正确'); }
                var blockInfo;
                if (Array.isArray(cfg.blocked_categories) || Array.isArray(cfg.keywords)) {
                    blockInfo = VA.setBlockConfig(cfg);
                } else {
                    blockInfo = { categories: 0, keywords: 0 };
                }
                renderBlockList();
                var info = '导入成功，屏蔽分类 ' + blockInfo.categories + ' 个、关键词 ' + blockInfo.keywords + ' 个';
                document.getElementById('blockImportInfo').textContent = info;
                document.getElementById('blockImportInfo').style.display = '';
                VAUtils.showToast('导入完成', 2500);
            } catch(e) {
                alert('导入失败：' + e.message);
            }
        };
        reader.readAsText(file);
    }

    function parseBlockInput(text) {
        return (text || '').split(/\n|,|，/).map(function(s) { return (s || '').trim(); }).filter(Boolean);
    }

    window.openBlockModal = function() {
        if (typeof VA === 'undefined' || !VA.getSourceById) { alert('API组件未就绪'); return; }
        document.getElementById('blockModal').classList.add('open');
        renderBlockList();
    };

    document.getElementById('btnBlockManage').addEventListener('click', function() {
        if (typeof VA === 'undefined' || !VA.getSourceById) { alert('API组件未就绪'); return; }
        VA.init(function() {
            openBlockModal();
        });
    });

    // 添加分类屏蔽
    document.getElementById('btnAddBlockCats').addEventListener('click', function() {
        var items = parseBlockInput(document.getElementById('blockCatInput').value);
        if (!items.length) { alert('请输入内容'); return; }
        var added = 0, dup = 0;
        items.forEach(function(item) { if (VA.addBlockedCategory(item)) added++; else dup++; });
        renderBlockList();
        document.getElementById('blockCatInput').value = '';
        if (added) VAUtils.showToast('已添加 ' + added + ' 个屏蔽分类', 2500);
        else if (dup) VAUtils.showToast('没有新增（可能已存在）', 2000);
    });

    // 添加关键词屏蔽（修复：此前这里只加分类，关键词被误存为分类）
    document.getElementById('btnAddBlockKws').addEventListener('click', function() {
        var items = parseBlockInput(document.getElementById('blockKwInput').value);
        if (!items.length) { alert('请输入内容'); return; }
        var added = 0, dup = 0;
        items.forEach(function(item) { if (VA.addBlockedKeyword(item)) added++; else dup++; });
        renderBlockList();
        document.getElementById('blockKwInput').value = '';
        if (added) VAUtils.showToast('已添加 ' + added + ' 个屏蔽关键词', 2500);
        else if (dup) VAUtils.showToast('没有新增（可能已存在）', 2000);
    });

    document.getElementById('btnExportBlocks').addEventListener('click', function() {
        if (typeof VA === 'undefined' || !VA.getBlockConfig) { alert('API组件未就绪'); return; }
        downloadBlockConfig();
    });

    document.getElementById('btnImportBlocks').addEventListener('click', function() {
        document.getElementById('blockFileInput').click();
    });

    document.getElementById('blockFileInput').addEventListener('change', function() {
        if (!this.files || !this.files[0]) return;
        importBlockConfigFromFile(this.files[0]);
        this.value = '';
    });

    // ========== 分类管理（WebView 版：个人源直接用 VAHttp 直连，不再走 buildProxyRequest）==========
    // 连点/快速切源时的竞态护栏：只渲染「最近一次点击」的结果，丢弃迟到的早前响应
    var catReqGen = 0;

    window.loadCats = function(index) {
        var s = sources[index];
        if (!s) return;
        var myGen = ++catReqGen;
        document.getElementById('catModalTitle').textContent = '「' + s.name + '」分类';
        var listEl = document.getElementById('catModalList');
        listEl.innerHTML = '<span class="cat-loading"><i class="fas fa-spinner fa-spin"></i> 正在获取分类...</span>';
        document.getElementById('catModal').classList.add('open');

        var baseUrl = (s.api_url || '').split('?')[0];
        if (!baseUrl || baseUrl.indexOf('http') !== 0) {
            listEl.innerHTML = '<span class="block-empty">地址无效</span>';
            return;
        }
        var catUrl = baseUrl + '?ac=vodtype';

        window.VAHttp.get(catUrl).then(function(data) {
            if (myGen !== catReqGen) return;
            if (!data) return;
            var items = data['class'] || data['data'] || [];
            var cats = [];
            items.forEach(function(item) {
                var id = item['type_id'] || item['id'];
                var name = item['type_name'] || item['name'];
                if (id !== undefined && name !== undefined) cats.push({ id: id, name: name });
            });
            if (!cats.length) {
                listEl.innerHTML = '<span class="block-empty">未能获取分类（站点可能不支持）</span>';
                return;
            }
            listEl.innerHTML = '';
            cats.forEach(function(c) {
                var btn = document.createElement('button');
                btn.className = 'cat-tag-btn' + (VA.isBlockedCategory(c.name) ? ' blocked' : '');
                btn.textContent = c.name;
                btn.addEventListener('click', function() {
                    var nowBlocked = !VA.isBlockedCategory(c.name);
                    if (nowBlocked) VA.addBlockedCategory(c.name);
                    else VA.removeBlockedCategory(c.name);
                    btn.classList.toggle('blocked', nowBlocked);
                    VAUtils.showToast(nowBlocked ? '已屏蔽分类：' + c.name : '已取消屏蔽：' + c.name, 2000);
                    renderBlockList();
                });
                listEl.appendChild(btn);
            });
        }).catch(function() {
            if (myGen !== catReqGen) return;
            listEl.innerHTML = '<span class="block-empty">分类获取失败</span>';
        });
    };

    // Init（先等 VA 完成 sources.json 加载/版本比对，再渲染管理列表）
    VA.init(function() {
        if (window.VANav) VANav.setupSiteSwitch();
        loadSources();
        updateStats();
        renderSources();
    });
})();
</script>
</body>
</html>
