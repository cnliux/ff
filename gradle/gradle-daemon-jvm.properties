# Gradle daemon JVM criteria.
#
# Only the major version is pinned. The file used to pin toolchainVendor=JETBRAINS
# plus a foojay download URL for one specific JetBrains build; when that build was
# withdrawn upstream the resolver answered HTTP 400 and every CI run, including the
# release build, died with "Unable to download toolchain matching the requirements
# (vendor=JetBrains)". Any JDK 21 satisfies this now: CI installs Temurin 21 through
# setup-java, and local builds point JAVA_HOME at the Android Studio JBR.
toolchainVersion=21
