name: Remote relay tests

on:
  push:
    branches: [main]
    paths:
      - 'serverless/webtv-remote-go/**'
      - '.github/workflows/remote-relay.yml'
  pull_request:
    branches: [main]
    paths:
      - 'serverless/webtv-remote-go/**'
      - '.github/workflows/remote-relay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: serverless/webtv-remote-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: serverless/webtv-remote-go/go.mod
          cache-dependency-path: serverless/webtv-remote-go/go.sum
      - name: Test relay
        run: go test -race ./...
      - name: Vet relay
        run: go vet ./...
      - name: Build Linux servers
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/webtv-remote-go-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o dist/webtv-remote-go-linux-arm64 .
      - uses: actions/upload-artifact@v4
        with:
          name: webtv-remote-go-linux
          path: serverless/webtv-remote-go/dist/webtv-remote-go-linux-*
          retention-days: 30
