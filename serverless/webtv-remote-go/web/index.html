<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WebTV 远程控制</title><link rel="stylesheet" href="/style.css"></head><body><main><header><span class="kicker">WEBTV</span><h1>远程控制</h1><p>搜索、推送与播放控制</p></header><section class="card"><div class="origin">当前服务 <code id="origin"></code></div><label>组令牌（已有组可填）<input id="group" type="password" autocomplete="off" placeholder="首次配对可留空"></label><div class="pair-row"><input id="code" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" placeholder="输入8位配对码" aria-label="8位配对码"><button id="claim">领取/加入设备</button></div><p class="hint">设备端生成的配对码仅短时有效且只能使用一次。首次领取会创建新组。</p><button id="load">连接设备</button><output id="msg"></output><div id="tokenNotice" class="notice" hidden><strong>新组令牌只显示在当前会话</strong><span id="newToken"></span><button id="copyToken" type="button">复制组令牌</button><button id="dismissToken" type="button">我已安全保存</button></div></section><section class="card"><div class="device-heading"><label>目标设备<select id="device"><option>请先连接</option></select></label><button id="revoke" class="danger" type="button" disabled>撤销授权</button></div><button data-action="status">读取状态</button></section><section class="card grid"><h2>搜索</h2><input id="word" maxlength="200" placeholder="片名、演员或关键词"><button data-action="search">搜索</button><h2>推送</h2><input id="url" maxlength="4096" inputmode="url" placeholder="https://..."><button data-action="push">推送播放</button></section><section class="card controls"><h2>播放控制</h2><button data-control="play">播放</button><button data-control="pause">暂停</button><button data-control="stop">停止</button><button data-control="prev">上一集</button><button data-control="next">下一集</button><button data-control="repeat">重复</button><button data-control="loop">循环</button><button data-control="replay">重播</button></section><pre id="result" aria-live="polite"></pre></main><script src="/app.js" defer></script></body></html>
