# Place this map in nginx's http context (outside all server blocks).
map $http_upgrade $webtv_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name remote.example.com;
    return 308 https://remote.example.com$request_uri;
    access_log off;
}
server {
    listen 443 ssl;
    server_name remote.example.com;
    ssl_certificate /etc/letsencrypt/live/remote.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/remote.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Do not record URLs, credentials or pairing requests in access logs.
    access_log off;
    error_log /var/log/nginx/webtv-remote-error.log crit;
    client_max_body_size 16k;
    client_body_timeout 15s;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $webtv_connection_upgrade;
        proxy_read_timeout 90s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }
}
